# /etc/nginx/conf.d/colrose.conf

# Upstream to the Django application
upstream colrose_server {
    server backend:8000;
}

# Redirect www to non-www and HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name www.colrose.ru colrose.ru;

    location / {
        return 301 https://colrose.ru$request_uri;
    }
}

# Main server configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name colrose.ru;

    # --- SSL Configuration ---
    ssl_certificate /run/secrets/ssl_cert;
    ssl_certificate_key /run/secrets/ssl_key;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Static and media files
    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    # Proxy to Django app
    location / {
        proxy_pass http://colrose_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect www to non-www for HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.colrose.ru;

    # Use the same SSL certs
    ssl_certificate /run/secrets/ssl_cert;
    ssl_certificate_key /run/secrets/ssl_key;

    return 301 https://colrose.ru$request_uri;
}
