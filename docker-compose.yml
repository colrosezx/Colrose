services:
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
    command: gunicorn colrose_server.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    environment:
      # These are static settings for the container environment
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DEBUG=0
    secrets:
      - backend_env

  nginx:
    build: ./nginx
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8080:80"
      - "8443:8443"
    depends_on:
      - backend
    secrets:
      - ssl_cert
      - ssl_key

volumes:
  postgres_data:
  static_volume:
  media_volume:

secrets:
  backend_env:
    file: ./.env
  ssl_cert:
    file: ./nginx/ssl_local_dev/localhost.crt
  ssl_key:
    file: ./nginx/ssl_local_dev/localhost.key
