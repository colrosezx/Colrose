# docker-compose.prod.yml
# This file is optimized for production.
# It assumes you have built your backend image with the latest code.
#
# To run:
# docker-compose -f docker-compose.prod.yml up -d --build
#
version: '3.8'

services:
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: .
    command: gunicorn colrose_server.wsgi:application --bind 0.0.0.0:8000 --workers=4
    volumes:
      # In production, the code is copied into the image at build time.
      # The volume mount for the code is removed to create an immutable container.
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    environment:
      # These are static settings for the container environment
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DEBUG=0
    secrets:
      - backend_env
    restart: always

  nginx:
    build: ./nginx
    volumes:
      # Mount the production Nginx config
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount static and media volumes
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    secrets:
      - ssl_cert
      - ssl_key
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:

secrets:
  backend_env:
    external: true
  ssl_cert:
    external: true
  ssl_key:
    external: true
